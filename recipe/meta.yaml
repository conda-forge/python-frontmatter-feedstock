{% set name = "python-frontmatter" %}
{% set version = "1.2.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 5b26ccd3cb85af77feb11d83b922c7bb5aeccb0c9d3fb236b938c600b6322984

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - pyyaml
    - pyaml
    - toml

test:
  imports:
    - frontmatter
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/eyeseast/python-frontmatter
  summary: Parse and manage posts with YAML (or other) frontmatter
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - abkfenris
